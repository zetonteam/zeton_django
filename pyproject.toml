[tool.poetry]
name = "zeton-django"
version = "0.1.0"
description = "Backend application for @ProjektZeton"
authors = ["Zetonteam <l.miotk.py@gmail.com>"]
license = "Apache"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Django = "^4.2.17"
psycopg = "^3.2.3"
djangorestframework = "^3.15.1"
django-cors-headers = "^4.6.0"
pyjwt = "^2.10.1"
six = "^1.17.0"
uritemplate = "^4.1.1"
drf-spectacular = "^0.28.0"
pytest = "^8.3.4"
pytest-django = "^4.11.1"
djangorestframework-simplejwt = "^5.3.1"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
